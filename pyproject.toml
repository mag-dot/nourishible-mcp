[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "nourishible-mcp-local"
version = "0.1.0"
description = "Local recipe extraction MCP server for Nourishible"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.scripts]
nourishible-mcp-local = "nourishible_mcp.server:main"

[tool.setuptools.packages.find]
include = ["nourishible_mcp*"]
