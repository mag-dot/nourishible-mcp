[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nourishible-local-worker"
version = "0.1.0"
description = "Outbound-only, human-confirmed evidence worker for Nourishible"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
nourishible-worker = "nourishible_worker.__main__:main"
